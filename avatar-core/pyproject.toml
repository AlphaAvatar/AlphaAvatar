[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-core"
dynamic = ["version"]
description = "Core runtime schemas and transport primitives for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
keywords = ["omni", "realtime", "audio", "video", "multimodal", "rtc", "runtime", "AI"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
livekit = ["livekit-api>=1.0.4,<2", "livekit-protocol~=1.0", "livekit>=1.0.12,<2"]
video = ["numpy>=1.26,<3", "opencv-python-headless==4.12.0.88"]

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"
Issues = "https://github.com/AlphaAvatar/AlphaAvatar/issues"

[tool.hatch.version]
path = "alphaavatar/core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml", "LICENSE"]
