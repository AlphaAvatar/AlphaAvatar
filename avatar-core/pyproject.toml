[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-core"
dynamic = ["version"]
description = "Core runtime schemas and transport primitives for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
keywords = [
    "omni",
    "realtime",
    "audio",
    "video",
    "multimodal",
    "rtc",
    "runtime",
    "AI",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
]

# Keep core minimal.
# Core schemas should not require LiveKit, LangChain, providers, VDB, or livekit-agents.
dependencies = []

[project.optional-dependencies]
livekit = [
    "livekit>=1.0.12,<2",
    "livekit-api>=1.0.4,<2",
    "livekit-protocol~=1.0",
]

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"

[tool.hatch.version]
path = "alphaavatar/core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml"]
