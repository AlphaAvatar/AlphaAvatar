default_language_version:
  python: python3.13

exclude: |
  (?x)(^|/)(
    \.venv[^/]*|venv|build|dist|node_modules|third_party|\.alphaavatar_workspace
  )(/|$)

repos:
  - repo: local
    hooks:
      - id: add-python-copyright
        name: Add Apache-2.0 license header (Python)
        entry: python3 scripts/add_copyright.py
        language: system
        types: [python]
        exclude: (^|/)migrations/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix, --show-fixes, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
