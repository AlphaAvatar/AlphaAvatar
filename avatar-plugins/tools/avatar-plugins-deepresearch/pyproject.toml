[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-plugins-deepresearch"
dynamic = ["version"]
description = "Public-web search and extraction tools for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["alpha-avatar-agents", "alpha-avatar-core", "httpx>=0.28,<1", "pydantic>=2,<3"]

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"
Issues = "https://github.com/AlphaAvatar/AlphaAvatar/issues"

[tool.hatch.version]
path = "alphaavatar/plugins/deepresearch/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml", "LICENSE"]
