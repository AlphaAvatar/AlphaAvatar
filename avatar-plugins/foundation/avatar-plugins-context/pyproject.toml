[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-plugins-context"
dynamic = ["version"]
description = "Runtime context management for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["alpha-avatar-core", "alpha-avatar-agents", "pydantic>=2,<3"]

[project.entry-points."alphaavatar.context"]
default = "alphaavatar.plugins.context"

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"

[tool.hatch.version]
path = "alphaavatar/plugins/context/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml"]
