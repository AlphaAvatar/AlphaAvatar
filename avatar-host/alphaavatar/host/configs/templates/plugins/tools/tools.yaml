# No tool is on. Switch one on here, then `alphaavatar setup <bundle>` installs what it needs.

deepresearch:
  plugin: null  # default: web research through Tavily, which reads TAVILY_API_KEY.
  init_config: {}

rag:
  plugin: null  # default: answers from your documents; `alphaavatar setup` does not install it yet.
  init_config:
    doc_parser: docling

mcp:
  enabled: false  # true: the Avatar calls the servers below; it needs at least one.
  plugin: default
  init_config: {}

  vdb_config:
    collection_name: mcp
    embedding:
      provider: openai
      model: text-embedding-3-small

  servers: {}
  # For example, LiveKit's documentation, and a server that needs a token. <ENV_VAR>
  # placeholders resolve from the environment, .env or the stored credentials:
  #   livekit-docs:
  #     url: https://docs.livekit.io/mcp/
  #     instruction: Search LiveKit's documentation, code, examples and changelogs.
  #   docs:
  #     url: https://example.com/mcp
  #     headers:
  #       Authorization: Bearer <MCP_DOCS_TOKEN>
