# AlphaAvatar documentation manifest.
#
# The repository files a docs site may publish, with their metadata. The text stays in each
# source file and is never copied here. Only `visibility: public` entries are published; internal
# entries, grouped work records and unlisted files are not. scripts/docs/check_docs.py checks
# this file, links and anchors, and the Roadmap.
#
# id                 stable identifier; never reused
# path               source file, relative to the repository root
# title              navigation title, in the document's language
# type               overview guide cli reference package plugin example development agent-guide
#                    roadmap release illustration record
# lang               language the text is written in: en or zh-CN; no other language exists
#                    unless a file for it does
# translation_group  entries that are the same document in different languages
# route              site path without a language prefix; unique per language; / is the site's
#                    own home page
# group, order       navigation: the group the document is listed in, and its place there
# visibility         public or internal
# status             current (describes this snapshot), planned (describes something not
#                    available), historical (describes a past version), illustrative (sample
#                    output, not evidence of a run or of performance)
# applies_to         snapshot, or the version a release document describes; not a Roadmap target
# release            release notes only: the tag and the GitHub Release publication day (UTC);
#                    release notes of one version in several languages share both
# format             html for a page that is not Markdown
#
# sections are the site's top-level sections, in order, each with a title and a summary in
# each language and its groups. A group may hold groups of its own, one level deep, listed
# after its documents; its title is one string for every language, or one per language, and
# its summary is optional. Group ids are unique across sections.
schema: 2
repository: AlphaAvatar/AlphaAvatar

sections:
  - id: guide
    title: {en: Guide, zh-CN: 指南}
    summary: {en: "Install AlphaAvatar, run a Host and start from complete configurations.", zh-CN: "安装 AlphaAvatar、运行 Host，并从完整配置开始。"}
    groups:
      - {id: get-started, title: {en: Get started, zh-CN: 开始使用}}
  - id: development
    title: {en: Development, zh-CN: 开发}
    summary: {en: "Set up a development environment, follow the conventions and contribute.", zh-CN: "搭建开发环境，遵循项目约定并参与贡献。"}
    groups:
      - {id: contribute, title: {en: Contribute, zh-CN: 参与开发}}
  - id: reference
    title: {en: Reference, zh-CN: 参考}
    summary: {en: "Look up system boundaries, directory layouts, commands and plugin contracts.", zh-CN: "查阅系统边界、目录布局、命令与插件的技术约定。"}
    groups:
      - id: architecture
        title: {en: Architecture and modules, zh-CN: 架构与模块}
        summary: {en: "The responsibilities and boundaries of Core, Agents, RTC, Host and App; the App's delivery status is as its own document says.", zh-CN: "Core、Agents、RTC、Host 与 App 的职责和边界；App 的交付状态以其原文为准。"}
      - id: identifiers
        title: {en: Identifiers and contracts, zh-CN: 标识与契约}
        summary: {en: "Tell participants, sessions, Turns and Runs apart and how they are associated.", zh-CN: "区分 Participant、Session、Turn 与 Run，理解它们的关联。"}
      - id: layouts
        title: {en: Directories and data, zh-CN: 目录与数据布局}
        summary: {en: "The application home, the application cache and each Avatar's workspace.", zh-CN: "应用主目录、应用缓存和每个 Avatar 的工作区。"}
      - id: cli-reference
        title: {en: CLI reference, zh-CN: CLI 参考}
        summary: {en: "The alphaavatar commands: install and configure, diagnose, start, upgrade and clean up.", zh-CN: "alphaavatar 各命令：安装与配置、诊断、启动、升级与清理。"}
      - id: plugin-reference
        title: {en: Plugin reference, zh-CN: 插件参考}
        summary: {en: "How plugins are laid out, and each Foundation, Perception and Tools plugin.", zh-CN: "插件的布局与边界，以及 Foundation、Perception、Tools 各插件。"}
        groups:
          - {id: foundation, title: Foundation}
          - {id: perception, title: Perception}
          - {id: tools, title: Tools}
  - id: updates
    title: {en: Updates, zh-CN: 项目进展}
    summary: {en: "Version goals and progress, and what each release delivered.", zh-CN: "版本目标与进展，以及每个版本交付的内容。"}
    groups:
      - {id: planning, title: {en: Planning and progress, zh-CN: 规划与进展}}
      - {id: releases, title: {en: Release notes, zh-CN: 发布记录}}

