[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-agents"
dynamic = ["version"]
description = "Transport-neutral Agent contracts and runtime composition for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
keywords = ["omni", "realtime", "audio", "video", "llm", "agents", "AI"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alpha-avatar-core",
    "filelock>=3.12",
    "huggingface-hub>=0.25",
    "jsonschema>=4.18,<5",
    "langchain-community",
    "langchain-core",
    "livekit-blingfire~=1.0",
    "markdown",
    "mcp>=1.10.0,<2",
    "omegaconf",
    "pydantic>=2,<3",
    "python-dotenv>=1.0.1",
    "python-slugify",
    "referencing>=0.30,<1",
    "weasyprint",
]

[project.optional-dependencies]
vdb = ["lancedb==0.30.2", "langchain-qdrant", "qdrant-client"]

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"
Issues = "https://github.com/AlphaAvatar/AlphaAvatar/issues"

[tool.hatch.version]
path = "alphaavatar/agents/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml", "LICENSE"]
