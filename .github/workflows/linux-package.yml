name: Linux package

# The Linux x86_64 base package install.sh installs, and the wheels `alphaavatar setup` adds by
# capability, built from the lock in manylinux_2_28 so their own native code needs no newer
# glibc than their wheels do; then installed from those very files on a clean Ubuntu with no
# Python, Node or compiler, as a person would. A push to main (a merge) or a dev branch that
# changes what goes into these files, checking that very commit; on demand, once this file is on
# the default branch, as GitHub requires; and every release tag, in full, through release.yml,
# which publishes only once this passes. Pushes produce CI artifacts only.
on:
  push:
    branches: ["main", "dev/**"]
    # What the files hold or are made from; documentation, logs and tests change none of them,
    # and Quality checks those. scripts/quality/check_workspace.py keeps every member covered.
    paths:
      - ".github/workflows/linux-package.yml"
      - ".github/workflows/release.yml"
      - ".python-version"
      - "uv.lock"
      - "pyproject.toml"
      - "packaging/**"
      - "avatar-*/pyproject.toml"
      - "avatar-*/alphaavatar/**"
      - "avatar-plugins/*/*/pyproject.toml"
      - "avatar-plugins/*/*/alphaavatar/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: "The vX.Y.Z tag being released; empty for a build of the commit"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Each commit merged to main is checked on its own, never queued behind or replaced by the
  # next; a newer push supersedes a dev build; a release finishes.
  group: linux-package-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ inputs.release == '' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and unzip
        run: |
          /opt/python/cp313-cp313/bin/python -m pip install uv==0.10.0
          echo "/opt/python/cp313-cp313/bin" >> "$GITHUB_PATH"
          command -v unzip || dnf -y install unzip
      - name: Build the base package and the capability wheels
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/linux/build.sh ${RELEASE:+--release "$RELEASE"} --out dist/linux
      - uses: actions/upload-artifact@v4
        with:
          name: alphaavatar-linux-x86_64-${{ github.sha }}
          path: dist/linux/
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # Re-running every job builds again: this attempt's files replace it.

  verify:
    # The files the build uploaded, installed the way DEPLOY.md tells a person to.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    env:
      # Placeholders: setup stores them; nothing here reaches a service.
      OPENAI_API_KEY: ci-placeholder
      LIVEKIT_URL: wss://livekit.invalid
      LIVEKIT_API_KEY: ci-placeholder
      LIVEKIT_API_SECRET: ci-placeholder
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alphaavatar-linux-x86_64-${{ github.sha }}
          path: /srv/alphaavatar
      - uses: actions/checkout@v4  # The glibc scanner only; nothing of it is installed.
        with:
          sparse-checkout: packaging/linux/glibc-floor.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: source
      - name: A clean machine
        run: |
          for tool in python3 python node gcc cc c++; do
            if command -v "$tool"; then echo "$tool is installed" >&2; exit 1; fi
          done
          cd /srv/alphaavatar && sha256sum -c SHA256SUMS
      - name: Install the base package
        run: |
          bash /srv/alphaavatar/install.sh --file /srv/alphaavatar/alphaavatar-*.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: The base runs its CLI from anywhere, and creates and checks configuration
        working-directory: /
        run: |
          alphaavatar --version
          alphaavatar --help > /dev/null
          alphaavatar config init reference --avatar-id reference > init.txt
          grep -F 'alphaavatar setup reference' init.txt
          # Nothing but the base: check names each implementation and what setup installs; wide
          # enough that each diagnostic is one line, as searched for here.
          if COLUMNS=1000 alphaavatar config check 2> check.txt; then exit 1; fi
          grep -F "loop.plugin: no installed package provides loop 'realtime'; \`alphaavatar setup\` installs it" check.txt
          if COLUMNS=1000 alphaavatar config check tools.rag.plugin=default 2> rag.txt; then exit 1; fi
          grep -F "\`alphaavatar setup\` does not offer it" rag.txt
      - name: Setup plans the reference bundle from its settings
        working-directory: /
        run: |
          alphaavatar setup reference --plan > plan.json 2> plan.err
          # stdout is the plan alone; the steps went to stderr.
          head -c 1 plan.json | grep -qx '{'
          grep -F 'Bundle reference' plan.err
          for name in torch llama-cpp-python insightface; do
            grep -q "\"name\": \"$name\"" plan.json || { echo "The plan lacks $name" >&2; exit 1; }
          done
          grep -c '"name":' plan.json
      - name: Setup installs, checks and enables the reference bundle
        working-directory: /
        run: |
          alphaavatar setup reference --artifacts /srv/alphaavatar
          alphaavatar config check
          alphaavatar config check \
            'runtime.inference.methods={"alphaavatar.voice.vad.silero": {"workers": 2}}' \
            | grep -F 'alphaavatar.voice.vad.silero x2'
      - name: Report sizes and the glibc floor
        run: |
          ls -l /srv/alphaavatar
          du -sh "$HOME"/.local/lib/alphaavatar/versions/* "$HOME"/.local/lib/alphaavatar/envs/*
          # After the clean steps: binutils reads the symbol versions native code needs.
          apt-get update -qq && apt-get install -y -qq binutils > /dev/null
          for dir in "$HOME"/.local/lib/alphaavatar/versions/* "$HOME"/.local/lib/alphaavatar/envs/*; do
            floor="$(source/packaging/linux/glibc-floor.sh "$dir")"
            echo "$dir needs glibc >= $floor"
            [[ -n "$floor" && "$(printf '%s\n' "$floor" 2.28 | sort -V | tail -n 1)" == 2.28 ]]
          done
