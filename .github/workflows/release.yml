name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Quality checks
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  notes:
    name: Generate Release Notes
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required by GitHub's releases/generate-notes API.
      contents: write

    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

          MANUAL_NOTES="docs/releases/${TAG}.md"
          GENERATED_NOTES="generated_notes.md"
          BODY_FILE="body.md"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"

          args=(
            -f "tag_name=$TAG"
            -f "target_commitish=$GITHUB_SHA"
            -f "configuration_file_path=.github/release.yml"
          )
          if [[ -n "$PREV" ]]; then
            args+=(-f "previous_tag_name=$PREV")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq '.body' > "$GENERATED_NOTES"

          if [[ -f "$MANUAL_NOTES" ]]; then
            cat "$MANUAL_NOTES" > "$BODY_FILE"
            if [[ -s "$GENERATED_NOTES" ]]; then
              printf '\n\n---\n\n' >> "$BODY_FILE"
            fi
          else
            printf '# AlphaAvatar %s\n\n' "$TAG" > "$BODY_FILE"
          fi
          cat "$GENERATED_NOTES" >> "$BODY_FILE"

          if [[ -n "$PREV" ]]; then
            printf '\n\nFull Changelog: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$BODY_FILE"
          fi
          test -s "$BODY_FILE"
          echo "Release notes generated for $TAG; previous release tag: ${PREV:-none}"

      - name: Share notes with release job
        uses: actions/upload-artifact@v4
        with:
          name: github-release-notes
          path: body.md
          if-no-files-found: error
          retention-days: 7

  github_release:
    name: Create GitHub Release
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Retrieve release notes
        uses: actions/download-artifact@v4
        with:
          name: github-release-notes

      - name: Create release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          test -s body.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; preserving its current notes."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AlphaAvatar $TAG" \
            --notes-file body.md
