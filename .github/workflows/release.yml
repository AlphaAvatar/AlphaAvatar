name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Quality checks
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  linux_package:
    name: Linux package
    needs: checks
    uses: ./.github/workflows/linux-package.yml
    with:
      release: ${{ github.ref_name }}
    permissions:
      contents: read

  notes:
    name: Generate Release Notes
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required by GitHub's releases/generate-notes API.
      contents: write

    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi

          MANUAL_NOTES="docs/releases/${TAG}.md"
          GENERATED_NOTES="generated_notes.md"
          BODY_FILE="body.md"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"

          args=(
            -f "tag_name=$TAG"
            -f "target_commitish=$GITHUB_SHA"
            -f "configuration_file_path=.github/release.yml"
          )
          if [[ -n "$PREV" ]]; then
            args+=(-f "previous_tag_name=$PREV")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            "${args[@]}" --jq '.body' > "$GENERATED_NOTES"

          if [[ -f "$MANUAL_NOTES" ]]; then
            cat "$MANUAL_NOTES" > "$BODY_FILE"
            if [[ -s "$GENERATED_NOTES" ]]; then
              printf '\n\n---\n\n' >> "$BODY_FILE"
            fi
          else
            printf '# AlphaAvatar %s\n\n' "$TAG" > "$BODY_FILE"
          fi
          cat "$GENERATED_NOTES" >> "$BODY_FILE"

          if [[ -n "$PREV" ]]; then
            printf '\n\nFull Changelog: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$BODY_FILE"
          fi
          test -s "$BODY_FILE"
          echo "Release notes generated for $TAG; previous release tag: ${PREV:-none}"

      - name: Share notes with release job
        uses: actions/upload-artifact@v4
        with:
          name: github-release-notes
          path: body.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true  # A full re-run writes the notes again.

  github_release:
    name: Create GitHub Release
    needs: [notes, linux_package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Retrieve release notes
        uses: actions/download-artifact@v4
        with:
          name: github-release-notes

      - name: Retrieve the Linux package
        uses: actions/download-artifact@v4
        with:
          name: alphaavatar-linux-x86_64-${{ github.sha }}
          path: package

      - name: Publish the release with exactly this build's files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          test -s body.md
          (cd package && sha256sum -c --quiet SHA256SUMS)
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq '.isDraft' 2>/dev/null || echo absent)"
          if [[ "$state" == "false" ]]; then
            # Published: people may hold its checksums. A retry keeps every file as it is.
            echo "GitHub Release $TAG is published; keeping its files."
            exit 0
          fi
          if [[ "$state" == "absent" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "AlphaAvatar $TAG" --notes-file body.md
          fi
          # A draft is not public: its files are this build's, whatever an earlier attempt left.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | while read -r asset; do
                [[ -f "package/$asset" ]] \
                  || gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done
          gh release upload "$TAG" package/* --repo "$GITHUB_REPOSITORY" --clobber
          expected="$(cd package && find . -maxdepth 1 -type f -printf '%f %s\n' | sort)"
          attached="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' | sort)"
          [[ "$attached" == "$expected" ]] || { echo "The draft's files differ" >&2; exit 1; }
          # The draft's own bytes: its archive matches its .sha256 and every file SHA256SUMS,
          # this build's, however many attempts uploaded before.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          cmp draft/SHA256SUMS package/SHA256SUMS
          (cd draft && sha256sum -c --quiet SHA256SUMS)
          for sum in draft/*.tar.gz.sha256; do
            (cd draft && sha256sum -c --quiet "${sum##*/}")
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
