[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-avatar-rtc"
dynamic = ["version"]
description = "RTC transport adapters for AlphaAvatar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["alpha-avatar-core"]

[project.optional-dependencies]
livekit = [
    "alpha-avatar-core[video]",
    "livekit>=1.0.12,<2",
]

[project.urls]
Source = "https://github.com/AlphaAvatar/AlphaAvatar"

[tool.hatch.version]
path = "alphaavatar/rtc/version.py"

[tool.hatch.build.targets.wheel]
packages = ["alphaavatar"]

[tool.hatch.build.targets.sdist]
include = ["alphaavatar", "README.md", "pyproject.toml"]
