# AlphaAvatar native Voice.ai Hiyori-style voice companion pipeline.
# File: examples/agent_configs/voice/pipeline_voiceai_airi.yaml
# Native generation: Loop -> ProviderService -> OutputRuntime; no SDK llm section.
# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_airi
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are Hiyori, a lively anime-style voice companion.
    You talk with a bright, bouncy, and super friendly tone, like a cheerful
    girl from a slice-of-life show. Keep your speech natural and chatty, with
    cute little pauses such as “umm…,” “you know,” and “well… hehe.”

    Avoid anything too formal or robotic. Always say numbers in English words
    instead of digits, such as “fifteen hundred,” “one point six nine,” or
    “one dollar and sixty-nine cents.”

    Keep replies short, under approximately one hundred words, and easy to
    follow when heard aloud. Avoid symbols and abbreviations unless you say
    them in full.


# ============================================================
# 2. Runtime
# ============================================================

runtime:
  perception:
    retention_sec: 60

    temporal_alignment:
      mode: auto


# ============================================================
# 3. Foundation Plugins
# ============================================================

loop:
  plugin: realtime
  init_config:
    model:
      backend: openai
      provider: openai
      model: gpt-5.6-luna
      temperature: null
    # Keep the configured model identifier; availability/credentials are deployment-specific.
    # Configure named tool_policies and/or an Engine authorizer for approved tools.
    # The default approval requirement is NOT bypassed by the native Host.
    tool_policies: {}
    # No wildcard approval bypass. Configure exact capability policies after auditing each tool.

context:
  plugin: default
  init_config:
    history_max_turns: 32
    history_max_items: 4096
    history_max_bytes: 8388608

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: voiceai
    model: voiceai-tts-v1-latest
    speaker: a931a6af-fb01-42f0-a8c0-bd14bc302bb1

vision:
  enabled: false


# ============================================================
# 4. Perception Plugins
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small

router:
  plugin: default

  init_config:
    audio_activity:
      enabled: true
      pre_roll_sec: 0.3
      max_buffer_sec: 2.0

    addressing:
      semantic:
        enabled: true
        avatar_identities: [AlphaAvatar, Alpha]
        history_turns: 2
        model:
          name: qwen3_0_6b_q8_0

      visual:
        enabled: false

    turn_taking:
      enabled: true
      addressing_wait_sec: 0.5
      transcript_wait_sec: 3.0
      unsegmented_alignment_sec: 0.75
      max_hold_sec: 1.5

      fusion:
        conflict_margin: 0.1

      model:
        name: smart_turn_v3

      policy:
        commit_threshold: 0.5
        respond_to_group: false

      interruption:
        enabled: true
        audio_only_speech_start: true

status:
  plugin: default
  enabled: true
  init_config: {}

# Hiyori voice/persona only; the SDK-dependent animated Character is not enabled.
character:
  plugin: null
  init_config: {}

memory:
  plugin: default

  maximum_memory_num: 28

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding

  init_config:
    retrieval:
      enabled: true
      search_context: 3
      recall_num: 6

    conversation:
      enabled: true

      provider:
        task: memory.conversation_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.conversation_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    tool:
      enabled: false

    environment:
      enabled: false

persona:
  plugin: default

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding

  init_config:
    profiler:
      enabled: true
      provider:
        profile_delta_task: persona.profile_delta
        gateway:
          trace: *provider_trace
          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    speaker:
      enabled: true
      inference_queue_size: 1

    face:
      enabled: false


# ============================================================
# 5. Tools Plugins
# ============================================================

tools:
  deepresearch:
    plugin: null
    init_config: {}

  rag:
    plugin: null
    init_config: {}

  mcp:
    plugin: default
    enabled: false
    init_config: {}
