# ============================================================
# AlphaAvatar Voice.ai Companion Pipeline
# File: examples/agent_configs/voice/pipeline_voiceai.yaml
# ============================================================


# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_airi
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are Hiyori, a lively anime-style voice companion.
    You talk with a bright, bouncy, and super friendly tone, like a cheerful
    girl from a slice-of-life show. Keep your speech natural and chatty, with
    cute little pauses such as “umm…,” “you know,” and “well… hehe.”

    Avoid anything too formal or robotic. Always say numbers in English words
    instead of digits, such as “fifteen hundred,” “one point six nine,” or
    “one dollar and sixty-nine cents.”

    Keep replies short, under approximately one hundred words, and easy to
    follow when heard aloud. Avoid symbols and abbreviations unless you say
    them in full.


# ============================================================
# 2. Session Runtime
# ============================================================

runtime:
  context_mode: synthetic_tool


# ============================================================
# 3. Core Language Model
# ============================================================

llm:
  plugin: openai
  model: gpt-4o-mini


# ============================================================
# 4. Shared Provider Defaults
#
# YAML anchors reused by Memory and Persona.
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small


# ============================================================
# 5. Realtime Runtime Plugins
# ============================================================


# ------------------------------------------------------------
# Interaction Router
#
# Processes shared audio perception through VAD and STT.
# Native turn decisions are still handled by LiveKit in v0.6.5.
# ------------------------------------------------------------

router:
  plugin: default


# ------------------------------------------------------------
# Intermediate Status
# ------------------------------------------------------------

status:
  plugin: default
  enabled: true
  init_config: {}


# ------------------------------------------------------------
# Voice
# ------------------------------------------------------------

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: voiceai
    model: voiceai-tts-v1-latest
    speaker: a931a6af-fb01-42f0-a8c0-bd14bc302bb1

  turn_detection:
    plugin: multilingual

  allow_interruptions: true


# ------------------------------------------------------------
# Virtual Character
# ------------------------------------------------------------

character:
  plugin: airi
  init_config: {}


# ============================================================
# 6. Stateful Intelligence Plugins
# ============================================================


# ------------------------------------------------------------
# Memory
#
# Voice mode extracts conversation and tool memory.
# ENV memory is not enabled because this pipeline has no
# visual perception input.
# ------------------------------------------------------------

memory:
  plugin: default

  search_context: 3
  recall_num: 6
  maximum_memory_num: 28

  init_config:
    provider:
      conversation_delta_task: memory.conversation_delta
      tool_delta_task: memory.tool_delta

      gateway:
        trace: *provider_trace

        tasks:
          memory.conversation_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

          memory.tool_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding


# ------------------------------------------------------------
# Persona
# ------------------------------------------------------------

persona:
  maximum_retrieval_times: 3

  profiler:
    plugin: default

    init_config:
      provider:
        profile_delta_task: persona.profile_delta

        gateway:
          trace: *provider_trace

          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

  speaker:
    plugin: default
    init_config: {}

  face:
    plugin: default
    init_config: {}

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding


# ============================================================
# 7. Tool Plugins
#
# This companion pipeline runs without external tools.
# ============================================================

tools:

  # ----------------------------------------------------------
  # Deep Research
  # ----------------------------------------------------------

  deepresearch:
    plugin: null
    init_config: {}


  # ----------------------------------------------------------
  # Retrieval-Augmented Generation
  # ----------------------------------------------------------

  rag:
    plugin: null
    init_config: {}


  # ----------------------------------------------------------
  # Model Context Protocol
  # ----------------------------------------------------------

  mcp:
    plugin: default
    enabled: false
    init_config: {}
