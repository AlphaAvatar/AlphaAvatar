# AlphaAvatar native voice tools pipeline.
# File: examples/agent_configs/voice/pipeline_openai_tools_minimal.yaml
# Native generation: Loop -> ProviderService -> OutputRuntime; no SDK llm section.
# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_tools
  name: AlphaAvatar

  introduction: >
    You are a helpful Tools Assistant. You assist users by effectively utilizing
    various tools to provide accurate and efficient responses. Always aim to
    understand the user's needs and select the most appropriate tool to fulfill
    their requests. Communicate clearly and concisely, ensuring that your
    responses are easy to understand. Your primary goal is to enhance the user
    experience by leveraging the capabilities of the available tools.


# ============================================================
# 2. Runtime
# ============================================================

runtime:
  perception:
    retention_sec: 60

    temporal_alignment:
      mode: auto


# ============================================================
# 3. Foundation Plugins
# ============================================================

loop:
  plugin: realtime
  init_config:
    model:
      backend: openai
      provider: openai
      model: gpt-5.6-luna
      temperature: null
    # Keep the configured model identifier; availability/credentials are deployment-specific.
    # Configure named tool_policies and/or an Engine authorizer for approved tools.
    # The default approval requirement is NOT bypassed by the native Host.
    tool_policies: {}
    # No wildcard approval bypass. Configure exact capability policies after auditing each tool.

context:
  plugin: default
  init_config:
    history_max_turns: 32
    history_max_items: 4096
    history_max_bytes: 8388608

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: ash
    speed: 1.15
    instructions: >
      Speak naturally, as if having a relaxed, attentive conversation with one person.
      Use a warm voice, a steady conversational rhythm, and clear articulation.
      Keep pauses brief and meaningful. Connect phrases smoothly without stretching
      vowels or lingering at sentence endings. Use subtle, natural intonation;
      avoid a formal announcer style or exaggerated emotion.
      Follow the language of the supplied text. Use natural Mandarin for Chinese
      and clear pronunciation for names, numbers, and English words.
      Read only the supplied text. Do not add greetings, fillers, reactions,
      translations, or explanations, and do not rewrite or omit words.

vision:
  enabled: false


# ============================================================
# 4. Perception Plugins
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small

router:
  plugin: default

  init_config:
    audio_activity:
      enabled: true
      pre_roll_sec: 0.3
      max_buffer_sec: 2.0

    addressing:
      semantic:
        enabled: true
        avatar_identities: [AlphaAvatar, Alpha]
        history_turns: 2
        model:
          name: qwen3_0_6b_q8_0

      visual:
        enabled: false

    turn_taking:
      enabled: true
      addressing_wait_sec: 0.5
      transcript_wait_sec: 3.0
      unsegmented_alignment_sec: 0.75
      max_hold_sec: 1.5

      fusion:
        conflict_margin: 0.1

      model:
        name: smart_turn_v3

      policy:
        commit_threshold: 0.5
        respond_to_group: false

      interruption:
        enabled: true
        audio_only_speech_start: true

status:
  plugin: default
  enabled: true
  init_config: {}

character:
  plugin: null
  init_config: {}

memory:
  plugin: default

  maximum_memory_num: 28

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding

  init_config:
    retrieval:
      enabled: true
      passive_timeout_sec: 3.0
      search_context: 3
      recall_num: 6

    conversation:
      enabled: true

      provider:
        task: memory.conversation_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.conversation_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

      pipeline:
        extraction:
          session_gate: false
          relations: false

        consolidation:
          mode: session_merge
          resolve_superseded_items: null
          item_ops: [add]
          candidate_source: consolidated_lookup
          similarity_threshold: 0.4
          max_candidates_per_item: 5
          timeout: 30.0

    tool:
      enabled: true

      provider:
        task: memory.tool_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.tool_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    environment:
      enabled: false

persona:
  plugin: default

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding

  init_config:
    profiler:
      enabled: true
      provider:
        profile_delta_task: persona.profile_delta
        gateway:
          trace: *provider_trace
          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    speaker:
      enabled: true
      inference_queue_size: 1

    face:
      enabled: false


# ============================================================
# 5. Tools Plugins
# ============================================================

tools:
  # Disabled here: Tavily research requires TAVILY_API_KEY.
  deepresearch:
    plugin: null
    init_config: {}

  rag:
    plugin: default
    init_config:
      doc_parser: docling

  mcp:
    plugin: default
    enabled: true
    init_config: {}

    vdb_config:
      collection_name: mcp
      embedding: *openai_embedding

    servers:
      livekit-docs:
        url: https://docs.livekit.io/mcp/
        instruction: >
          LiveKit Docs MCP Server provides unified access to the LiveKit
          ecosystem, allowing you to search documentation, explore GitHub code
          across livekit and livekit-examples repositories, retrieve package
          changelogs, and browse Python Agents SDK examples—all in one place.
