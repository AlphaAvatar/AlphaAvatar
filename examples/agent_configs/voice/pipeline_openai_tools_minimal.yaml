# ============================================================
# AlphaAvatar Voice Tools Pipeline
# File: examples/agent_configs/voice/pipeline_openai_tools.yaml
# ============================================================


# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_tools
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are a helpful Tools Assistant. You assist users by effectively utilizing
    various tools to provide accurate and efficient responses. Always aim to
    understand the user's needs and select the most appropriate tool to fulfill
    their requests. Communicate clearly and concisely, ensuring that your
    responses are easy to understand. Your primary goal is to enhance the user
    experience by leveraging the capabilities of the available tools.


# ============================================================
# 2. Session Runtime
# ============================================================

runtime:
  context_mode: synthetic_tool


# ============================================================
# 3. Core Language Model
# ============================================================

llm:
  plugin: openai
  model: gpt-4o-mini


# ============================================================
# 4. Shared Provider Defaults
#
# YAML anchors reused by Memory, Persona, and MCP.
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small


# ============================================================
# 5. Realtime Runtime Plugins
# ============================================================


# ------------------------------------------------------------
# Interaction Router
#
# Processes shared audio perception through VAD and STT.
# Native turn decisions are still handled by LiveKit in v0.6.5.
# ------------------------------------------------------------

router:
  plugin: default


# ------------------------------------------------------------
# Intermediate Status
# ------------------------------------------------------------

status:
  plugin: default
  enabled: true
  init_config: {}


# ------------------------------------------------------------
# Voice
# ------------------------------------------------------------

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: ash
    instructions: Speak in a friendly and conversational tone.

  turn_detection:
    plugin: multilingual

  allow_interruptions: true


# ------------------------------------------------------------
# Virtual Character
# ------------------------------------------------------------

character:
  plugin: null
  init_config: {}


# ============================================================
# 6. Stateful Intelligence Plugins
# ============================================================


# ------------------------------------------------------------
# Memory
#
# Voice mode extracts conversation and tool memory.
# ENV memory is not enabled because this pipeline has no
# visual perception input.
# ------------------------------------------------------------

memory:
  plugin: default

  search_context: 3
  recall_num: 6
  maximum_memory_num: 28

  init_config:
    provider:
      conversation_delta_task: memory.conversation_delta
      tool_delta_task: memory.tool_delta

      gateway:
        trace: *provider_trace

        tasks:
          memory.conversation_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

          memory.tool_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

    pipeline:
      extraction:
        # Emit nothing when the session holds no durable value.
        session_gate: false
        # Semantic relations between the entities each memory already
        # mentions. Not implemented; entities alone become graph nodes.
        relations: false

      key:
        organization: merge_by_value
        include_topic: true

      value:
        source: item

      note:
        # off             -- atomic item layer only
        # session_summary -- one immutable note per session, keeps the detail
        #                    atomic extraction drops
        # session_merge   -- notes merge across sessions, so a later
        #                    correction takes effect
        mode: session_merge
        # null follows the mode default: on for session_merge, off otherwise.
        resolve_covered_items: null
        max_item_ids: 200

      maintenance:
        item_ops: [add]
        # note_lookup (one RPC) | query_recall (reuses this session's recalls)
        # | union
        candidate_source: note_lookup
        similarity_threshold: 0.82
        max_candidates_per_item: 5
        timeout: 30.0

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding


# ------------------------------------------------------------
# Persona
# ------------------------------------------------------------

persona:
  maximum_retrieval_times: 3

  profiler:
    plugin: default

    init_config:
      provider:
        profile_delta_task: persona.profile_delta

        gateway:
          trace: *provider_trace

          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

  speaker:
    plugin: default
    init_config: {}

  face:
    plugin: default
    init_config: {}

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding


# ============================================================
# 7. Tool Plugins
# ============================================================

tools:

  # ----------------------------------------------------------
  # Deep Research
  # ----------------------------------------------------------

  # Disabled: the default implementation is Tavily, which requires TAVILY_API_KEY.
  deepresearch:
    plugin: null
    init_config: {}


  # ----------------------------------------------------------
  # Retrieval-Augmented Generation
  # ----------------------------------------------------------

  rag:
    plugin: default

    init_config:
      doc_parser: docling


  # ----------------------------------------------------------
  # Model Context Protocol
  # ----------------------------------------------------------

  mcp:
    plugin: default
    enabled: true
    init_config: {}

    vdb_config:
      collection_name: mcp
      embedding: *openai_embedding

    servers:
      livekit-docs:
        url: https://docs.livekit.io/mcp/

        instruction: >
          LiveKit Docs MCP Server provides unified access to the LiveKit
          ecosystem, allowing you to search documentation, explore GitHub code
          across livekit and livekit-examples repositories, retrieve package
          changelogs, and browse Python Agents SDK examples—all in one place.

      # Removed: the github-copilot server needs GITHUB_PAT, and the placeholder is
      # resolved when ToolsConfig is constructed, so an unset variable fails at
      # startup even if the tool is never called. See the full example config to
      # restore it.
