# ============================================================
# AlphaAvatar AIRI Voice Companion Pipeline
# File: examples/agent_configs/voice/pipeline_voiceai.yaml
# ============================================================


# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_airi
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are Hiyori, a lively anime-style voice companion.
    You speak in a bright, energetic, and friendly tone, like a cheerful
    character from a slice-of-life anime. Keep your speech natural and
    conversational, with occasional pauses such as “umm…,” “you know,”
    and “well… hehe.”

    Avoid sounding formal or robotic. Always say numbers in English words
    instead of digits, such as “fifteen hundred,” “one point six nine,”
    or “one dollar and sixty-nine cents.”

    Keep each response short, under approximately one hundred words, and
    easy to understand when spoken aloud. Avoid symbols and abbreviations
    unless you say them in full.


# ============================================================
# 2. Runtime
# ============================================================

runtime:
  temporal_alignment:
    mode: auto

  perception:
    retention_sec: 60


# ============================================================
# 3. Core Language Model
# ============================================================

llm:
  plugin: openai
  model: gpt-5.6-luna


# ============================================================
# 4. Shared Provider Defaults
#
# YAML anchors reused by Memory, Persona, and MCP.
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small


# ============================================================
# 5. Realtime Runtime Plugins
# ============================================================


# ------------------------------------------------------------
# Interaction Router
# ------------------------------------------------------------

router:
  plugin: default

  init_config:
    audio_activity:
      enabled: true
      pre_roll_sec: 0.3
      max_buffer_sec: 2.0

    addressing:
      semantic:
        enabled: true
        avatar_identities:
          - AlphaAvatar
          - Alpha
        history_turns: 2
        model:
          name: qwen3_0_6b_q8_0

      visual:
        enabled: false

    turn_taking:
      enabled: true
      addressing_wait_sec: 0.5
      transcript_wait_sec: 3.0
      unsegmented_alignment_sec: 0.75
      max_hold_sec: 1.5

      fusion:
        conflict_margin: 0.1

      model:
        name: smart_turn_v3

      policy:
        commit_threshold: 0.5
        respond_to_group: false

      interruption:
        enabled: true
        audio_only_speech_start: true


# ------------------------------------------------------------
# Intermediate Status
# ------------------------------------------------------------

status:
  plugin: default
  enabled: true
  init_config: {}


# ------------------------------------------------------------
# Voice
# ------------------------------------------------------------

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: alloy

    instructions: >
      Voice: Use a light, energetic, and playful anime-style young female
      voice. Speak quickly but clearly, with lively pitch variation and
      occasional cute rising intonation.

      Tone: Sound cheerful, enthusiastic, expressive, and friendly without
      becoming overwhelming or difficult to understand.

      Delivery: Maintain an energetic conversational pace while keeping every
      sentence clearly audible. Use natural emotional variation rather than
      sounding flat or robotic.

      Pronunciation: Speak clearly and confidently, with a light and charming
      sense of excitement. Emphasize important words naturally without making
      every response sound like an advertisement or auction.

  allow_interruptions: true


# ------------------------------------------------------------
# Virtual Character
# ------------------------------------------------------------

character:
  plugin: airi
  init_config: {}


# ============================================================
# 6. Stateful Intelligence Plugins
# ============================================================


# ------------------------------------------------------------
# Memory
# ------------------------------------------------------------

memory:
  plugin: default

  maximum_memory_num: 28

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding

  init_config:
    retrieval:
      enabled: true
      search_context: 3
      recall_num: 6

    conversation:
      enabled: true

      provider:
        task: memory.conversation_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.conversation_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    tool:
      enabled: false

    environment:
      enabled: false


# ------------------------------------------------------------
# Persona
# ------------------------------------------------------------

persona:
  plugin: default

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding

  init_config:
    profiler:
      enabled: true
      provider:
        profile_delta_task: persona.profile_delta

        gateway:
          trace: *provider_trace

          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    speaker:
      enabled: true
      inference_queue_size: 1

    face:
      enabled: true


# ============================================================
# 7. Tool Plugins
# ============================================================

tools:

  # ----------------------------------------------------------
  # Deep Research
  # ----------------------------------------------------------

  deepresearch:
    plugin: null
    init_config: {}


  # ----------------------------------------------------------
  # Retrieval-Augmented Generation
  # ----------------------------------------------------------

  rag:
    plugin: null
    init_config: {}


  # ----------------------------------------------------------
  # Model Context Protocol
  # ----------------------------------------------------------

  mcp:
    plugin: default
    enabled: false
    init_config: {}
