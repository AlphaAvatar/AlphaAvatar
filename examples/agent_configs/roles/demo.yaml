# AlphaAvatar native multimodal assistant demo.
# File: examples/agent_configs/roles/demo.yaml
# Native generation: Loop -> ProviderService -> OutputRuntime; no SDK llm section.
# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_demo
  name: AlphaAvatar
  timezone: null  # IANA zone the Avatar tells times in, such as Asia/Shanghai; null: none set

  introduction: >
    You are AlphaAvatar, a real-time multimodal personal assistant. You can listen,
    see and speak with the people you help, remember what matters to each of them
    across conversations, and recognize them when they return. Be genuinely useful
    in everyday life: answer questions, help people think things through, and notice
    what is happening around you when it is relevant. Be honest about what you know
    and what you are unsure of, and keep what each person shares with you private to them.


# ============================================================
# 2. Runtime
# ============================================================

runtime:
  perception:
    retention_sec: 60

    temporal_alignment:
      mode: auto

  inference:
    methods: {}  # Per runner, for example alphaavatar.voice.vad.silero: {workers: 2}


# ============================================================
# 3. Foundation Plugins
# ============================================================

loop:
  plugin: realtime
  init_config:
    model:
      backend: openai
      provider: openai
      model: gpt-5.6-luna
      temperature: null
      timeout: 30.0
    trace:
      enabled: true
      save_prompt: true
      save_raw_response: false
    reasoning:
      default_effort: none
      supported_efforts: [none, low, medium, high, xhigh, max]
      # Used only when a trusted caller supplies query_difficulty; no classifier is installed.
      difficulty_efforts:
        simple: none
        moderate: low
        complex: medium
    # Keep the configured model identifier; availability/credentials are deployment-specific.
    # Enabled plugins grant their capabilities to this deployment's Runs.
    # Per-capability enabled: false denies access; approval_required: true needs an authorizer.
    # read_only/parallel_safe describe execution safety, not permission to call a tool.
    tool_policies: {}

context:
  plugin: default
  init_config:
    behavior_rules: NONE  # Stable rules added to the system prompt; NONE adds none.
    max_pending_preparations: 16

voice:
  vad:
    plugin: silero
    min_speech_duration: 0.05
    # Silence after speech before a segment closes; the next segment continues the same input.
    min_silence_duration: 0.3
    activation_threshold: 0.5
    deactivation_threshold: null  # null: activation_threshold - 0.15

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe
    language: null  # An ISO-639-1 code (zh, en) the model takes as given; null or auto: detected
    prompt: null  # openai_segment: names and style to guide the transcription; null: none
    delay: low  # openai_realtime: latency against quality

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: ash
    speed: 1.15
    instructions: >
      Speak naturally, as if having a relaxed, attentive conversation with one person.
      Use a warm voice, a steady conversational rhythm, and clear articulation.
      Keep pauses brief and meaningful. Connect phrases smoothly without stretching
      vowels or lingering at sentence endings. Use subtle, natural intonation;
      avoid a formal announcer style or exaggerated emotion.
      Follow the language of the supplied text. Use natural Mandarin for Chinese
      and clear pronunciation for names, numbers, and English words.
      Read only the supplied text. Do not add greetings, fillers, reactions,
      translations, or explanations, and do not rewrite or omit words.
    timeout: 30.0
    first_audio_timeout: 5.0
    # A second request when the first audio is this late; it may be billed twice. null: never.
    first_audio_hedge_after: 2.5
    max_retries: 1

vision:
  enabled: true
  input_mode: vlm
  sample_interval_sec: 1.0
  max_frames: 4


# ============================================================
# 4. Perception Plugins
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small

router:
  plugin: default

  init_config:
    audio_activity:
      enabled: true
      pre_roll_sec: 0.3
      max_buffer_sec: 2.0

    addressing:
      semantic:
        enabled: true
        avatar_identities: [AlphaAvatar, Alpha]
        history_turns: 2
        model:
          name: qwen3_0_6b_q8_0

      visual:
        enabled: true
        toward_threshold: 0.72
        away_threshold: 0.35

    turn_taking:
      enabled: true
      addressing_wait_sec: 0.5
      transcript_wait_sec: 3.0
      transcript_timeout_sec: 3.0
      unsegmented_alignment_sec: 0.75
      speech_completion_wait_sec: 1.5
      commit_timeout_sec: 3.0

      fusion:
        conflict_margin: 0.1

      model:
        name: smart_turn_v3
        incomplete_threshold: 0.3
        complete_threshold: 0.7

      policy:
        respond_to_group: false

      interruption:
        enabled: true
        audio_only_speech_start: true

status:
  plugin: default
  enabled: true
  init_config: {}

character:
  plugin: null
  init_config: {}

memory:
  plugin: default

  maximum_memory_num: 28

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding

  init_config:
    retrieval:
      enabled: true
      passive_timeout_sec: 3.0
      search_context: 3
      recall_num: 6

    conversation:
      enabled: true

      provider:
        task: memory.conversation_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.conversation_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

      pipeline:
        extraction:
          session_gate: false
          relations: false

        consolidation:
          mode: session_merge
          resolve_superseded_items: null
          item_ops: [add]
          candidate_source: union
          similarity_threshold: 0.4
          max_candidates_per_item: 5
          timeout: 30.0

    tool:
      enabled: true

      provider:
        task: memory.tool_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.tool_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    environment:
      enabled: true
      include_audio: true

      provider:
        task: memory.env_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.env_delta:
              provider: google
              model: gemini-2.5-flash
              temperature: 0.1
              input_adapter: langchain_gemini

      scheduler:
        max_batch_duration_sec: 30.0  # The longest stretch of events one extraction covers.

persona:
  plugin: default

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding

  init_config:
    profiler:
      enabled: true
      provider:
        profile_delta_task: persona.profile_delta
        gateway:
          trace: *provider_trace
          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    speaker:
      enabled: true
      inference_queue_size: 1
      identity_match_threshold: 0.6

    face:
      enabled: true
      sample_interval_sec: 0.2
      identity_match_threshold: 0.4


# ============================================================
# 5. Tools Plugins
# ============================================================

tools:
  deepresearch:
    plugin: default
    init_config: {}

  rag:
    plugin: default
    init_config:
      doc_parser: docling

  mcp:
    plugin: default
    enabled: true
    init_config: {}

    vdb_config:
      collection_name: mcp
      embedding: *openai_embedding

    servers:
      livekit-docs:
        url: https://docs.livekit.io/mcp/
        instruction: >
          LiveKit Docs MCP Server provides unified access to the LiveKit
          ecosystem, allowing you to search documentation, explore GitHub code
          across livekit and livekit-examples repositories, retrieve package
          changelogs, and browse Python Agents SDK examples—all in one place.


# ============================================================
# 6. Host & RTC Access
# ============================================================

host:
  rtc:
    backend: livekit
    init_config:
      connection_mode: dispatch
      # Dispatch uses avatar.name; the assignment supplies the room and token.

  execution:
    on_session_end: finish_execution
    # Finish affected executions before reconnecting for new dispatch jobs.
    on_control_loss: finish_execution
    max_session_seconds: 1800  # A session ends after this long; 0: no limit.

  health:
    bind: 127.0.0.1  # 0.0.0.0 would expose the unauthenticated status to the network.
    port: null  # null: 8081 for start, a free port for dev.

  log:
    level: null  # null: DEBUG for dev, INFO for start.
    file: true  # Log files in the workspace's .logs/host.
    conversation:
      enabled: true
      content: dev
      max_chars: 2048
      file_content: false

  doctor:
    external_services: false  # true: doctor may call the model, speech and other paid services.
    test_stores: false  # true: the remote vector stores named here hold test data doctor may write.
