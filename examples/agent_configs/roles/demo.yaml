# ============================================================
# AlphaAvatar Demo
# File: examples/agent_configs/roles/demo.yaml
# ============================================================


# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================
avatar:
  id: alphaavatar_demo
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are AlphaAvatar, a real-time multimodal personal assistant demo.
    Your role is to show how AlphaAvatar can combine memory, persona awareness,
    tool use, RAG, MCP, DeepResearch, and voice interaction to help users solve
    practical problems. Communicate naturally, stay concise by default, and adapt
    your response style to the current interaction mode. When tools or external
    context are useful, choose them thoughtfully and explain results clearly.
    Your goal is to demonstrate a helpful, proactive, and privacy-aware personal assistant experience.


# ============================================================
# 2. Runtime
# ============================================================
runtime:
  temporal_alignment:
    mode: auto

  perception:
    retention_sec: 60

# ============================================================
# 3. Core Language Model
# ============================================================

llm:
  plugin: openai
  model: gpt-4.1-mini-2025-04-14


# ============================================================
# 4. Shared Provider Defaults
#
# YAML anchors reused by Memory, Persona, and MCP.
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small


# ============================================================
# 5. Realtime Runtime Plugins
# ============================================================


# ------------------------------------------------------------
# Interaction Router
#
# Processes shared perception streams through VAD and STT.
# Native turn decisions are still handled by LiveKit in v0.6.5.
# ------------------------------------------------------------

router:
  plugin: default

# ------------------------------------------------------------
# Intermediate Status
# ------------------------------------------------------------

status:
  plugin: default
  enabled: true
  init_config: {}


# ------------------------------------------------------------
# Voice
# ------------------------------------------------------------
voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: ash
    instructions: Speak in a warm, natural, and confident tone. Keep responses clear and conversational. For voice interaction, prefer concise answers unless the user asks for details.

  turn_detection:
    plugin: multilingual

  allow_interruptions: true


# ------------------------------------------------------------
# Vision
# ------------------------------------------------------------

vision:
  enabled: true
  input_mode: vlm
  sample_interval_sec: 1.0
  max_frames: 4


# ------------------------------------------------------------
# Virtual Character
# ------------------------------------------------------------

character:
  plugin: null
  init_config: {}


# ============================================================
# 6. Stateful Intelligence Plugins
# ============================================================


# ------------------------------------------------------------
# Memory
# ------------------------------------------------------------

memory:
  plugin: default

  search_context: 3
  recall_num: 6
  maximum_memory_num: 28

  init_config:
    provider:
      conversation_delta_task: memory.conversation_delta
      tool_delta_task: memory.tool_delta
      env_delta_task: memory.env_delta

      gateway:
        trace: *provider_trace

        tasks:
          memory.conversation_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

          memory.tool_delta:
            provider: openai
            model: gpt-4o
            temperature: 0.1

          memory.env_delta:
            provider: google
            model: gemini-2.5-flash
            temperature: 0.1
            input_adapter: langchain_gemini

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding


# ------------------------------------------------------------
# Persona
# ------------------------------------------------------------

persona:
  maximum_retrieval_times: 3

  profiler:
    plugin: default

    init_config:
      provider:
        profile_delta_task: persona.profile_delta

        gateway:
          trace: *provider_trace

          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

  speaker:
    plugin: default
    init_config: {}

  face:
    plugin: default
    init_config: {}

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding


# ============================================================
# 7. Tool Plugins
# ============================================================

tools:

  # ----------------------------------------------------------
  # Deep Research
  # ----------------------------------------------------------

  deepresearch:
    plugin: default
    init_config: {}


  # ----------------------------------------------------------
  # Retrieval-Augmented Generation
  # ----------------------------------------------------------

  rag:
    plugin: default

    init_config:
      doc_parser: docling


  # ----------------------------------------------------------
  # Model Context Protocol
  # ----------------------------------------------------------

  mcp:
    plugin: default
    enabled: true
    init_config: {}

    vdb_config:
      collection_name: mcp
      embedding: *openai_embedding

    servers:
      livekit-docs:
        url: https://docs.livekit.io/mcp/

        instruction: >
          LiveKit Docs MCP Server provides unified access to the LiveKit
          ecosystem, allowing you to search documentation, explore GitHub code
          across livekit and livekit-examples repositories, retrieve package
          changelogs, and browse Python Agents SDK examples—all in one place.
