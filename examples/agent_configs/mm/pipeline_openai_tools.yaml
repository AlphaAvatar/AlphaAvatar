# ============================================================
# AlphaAvatar Multimodal Tools Pipeline
# File: examples/agent_configs/mm/pipeline_openai_tools.yaml
# ============================================================


# ============================================================
# 1. Avatar Identity & Workspace
# ============================================================

avatar:
  id: alphaavatar_tools
  name: AlphaAvatar
  work_dir: .alphaavatar_workspace/

  introduction: >
    You are a helpful Tools Assistant. You assist users by effectively utilizing
    various tools to provide accurate and efficient responses. Always aim to
    understand the user's needs and select the most appropriate tool to fulfill
    their requests. Communicate clearly and concisely, ensuring that your
    responses are easy to understand. Your primary goal is to enhance the user
    experience by leveraging the capabilities of the available tools.


# ============================================================
# 2. Runtime
# ============================================================

runtime:
  temporal_alignment:
    mode: auto

  perception:
    retention_sec: 60


# ============================================================
# 3. Core Language Model
# ============================================================

llm:
  plugin: openai
  model: gpt-5.6-luna


# ============================================================
# 4. Shared Provider Defaults
#
# YAML anchors reused by Memory, Persona, and MCP.
# ============================================================

defaults:
  provider_trace: &provider_trace
    enabled: true
    save_prompt: true

  openai_embedding: &openai_embedding
    provider: openai
    model: text-embedding-3-small


# ============================================================
# 5. Realtime Runtime Plugins
# ============================================================


# ------------------------------------------------------------
# Interaction Router
# ------------------------------------------------------------

router:
  plugin: default

  init_config:
    audio_activity:
      enabled: true
      pre_roll_sec: 0.3
      max_buffer_sec: 2.0

    addressing:
      addressing_wait_sec: 0.5

      semantic:
        enabled: true
        avatar_identities:
          - AlphaAvatar
          - Alpha
        history_turns: 2

        model:
          name: qwen3_0_6b_q8_0

      visual:
        enabled: true

      fusion:
        conflict_margin: 0.1

    turn_taking:
      enabled: true
      transcript_wait_sec: 3.0

      model:
        name: smart_turn_v3

      policy:
        commit_threshold: 0.5
        max_hold_sec: 1.5

      interruption:
        enabled: true
        audio_only_speech_start: true


# ------------------------------------------------------------
# Intermediate Status
# ------------------------------------------------------------

status:
  plugin: default
  enabled: true
  init_config: {}


# ------------------------------------------------------------
# Voice
# ------------------------------------------------------------

voice:
  vad:
    plugin: silero

  stt:
    plugin: openai_segment
    model: gpt-4o-transcribe

  tts:
    plugin: openai
    model: gpt-4o-mini-tts
    speaker: ash
    instructions: Speak in a friendly and conversational tone.

  allow_interruptions: true


# ------------------------------------------------------------
# Vision
# ------------------------------------------------------------

vision:
  enabled: true
  input_mode: vlm
  sample_interval_sec: 1.0
  max_frames: 6


# ------------------------------------------------------------
# Virtual Character
# ------------------------------------------------------------

character:
  plugin: null
  init_config: {}


# ============================================================
# 6. Stateful Intelligence Plugins
# ============================================================


# ------------------------------------------------------------
# Memory
# ------------------------------------------------------------

memory:
  plugin: default

  search_context: 3
  recall_num: 6
  maximum_memory_num: 28

  vdb_config:
    collection_name: memory
    embedding: *openai_embedding

  init_config:
    retrieval:
      enabled: true

    conversation:
      enabled: true

      provider:
        task: memory.conversation_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.conversation_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

      pipeline:
        extraction:
          session_gate: false
          relations: false

        consolidation:
          mode: session_merge
          resolve_superseded_items: null

        maintenance:
          item_ops:
            - add
          candidate_source: consolidated_lookup
          similarity_threshold: 0.82
          max_candidates_per_item: 5
          timeout: 30.0

    tool:
      enabled: true

      provider:
        task: memory.tool_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.tool_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    environment:
      enabled: true
      include_audio: true

      provider:
        task: memory.env_delta
        gateway:
          trace: *provider_trace
          tasks:
            memory.env_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1


# ------------------------------------------------------------
# Persona
# ------------------------------------------------------------

persona:
  plugin: default

  vdb_config:
    profiler_collection_name: persona_profiler
    speaker_collection_name: persona_speaker
    face_collection_name: persona_face
    embedding: *openai_embedding

  init_config:
    profiler:
      enabled: true
      provider:
        profile_delta_task: persona.profile_delta

        gateway:
          trace: *provider_trace

          tasks:
            persona.profile_delta:
              provider: openai
              model: gpt-4o
              temperature: 0.1

    speaker:
      enabled: true
      inference_queue_size: 1

    face:
      enabled: true


# ============================================================
# 7. Tool Plugins
# ============================================================

tools:

  # ----------------------------------------------------------
  # Deep Research
  # ----------------------------------------------------------

  deepresearch:
    plugin: default
    init_config: {}


  # ----------------------------------------------------------
  # Retrieval-Augmented Generation
  # ----------------------------------------------------------

  rag:
    plugin: default

    init_config:
      doc_parser: docling


  # ----------------------------------------------------------
  # Model Context Protocol
  # ----------------------------------------------------------

  mcp:
    plugin: default
    enabled: true
    init_config: {}

    vdb_config:
      collection_name: mcp
      embedding: *openai_embedding

    servers:
      livekit-docs:
        url: https://docs.livekit.io/mcp/

        instruction: >
          LiveKit Docs MCP Server provides unified access to the LiveKit
          ecosystem, allowing you to search documentation, explore GitHub code
          across livekit and livekit-examples repositories, retrieve package
          changelogs, and browse Python Agents SDK examples—all in one place.
