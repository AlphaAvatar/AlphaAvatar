# Workspace policy and development tools live here; runtime metadata stays in each package.
[tool.uv]
required-version = ">=0.10.0"
default-groups = ["dev", "avatar-agent-all"]

[tool.uv.workspace]
members = [
    "avatar-core",
    "avatar-agents",
    "avatar-rtc",
    "avatar-host",
    "avatar-plugins/foundation/*",
    "avatar-plugins/perception/*",
    "avatar-plugins/tools/*",
]

[tool.uv.sources]
alpha-avatar-core = { workspace = true }
alpha-avatar-agents = { workspace = true }
alpha-avatar-rtc = { workspace = true }
alpha-avatar-host = { workspace = true }
alpha-avatar-plugins-context = { workspace = true }
alpha-avatar-plugins-loop = { workspace = true }
alpha-avatar-plugins-provider = { workspace = true }
alpha-avatar-plugins-voice = { workspace = true }
alpha-avatar-plugins-character = { workspace = true }
alpha-avatar-plugins-memory = { workspace = true }
alpha-avatar-plugins-persona = { workspace = true }
alpha-avatar-plugins-router = { workspace = true }
alpha-avatar-plugins-status = { workspace = true }
alpha-avatar-plugins-deepresearch = { workspace = true }
alpha-avatar-plugins-mcp = { workspace = true }
alpha-avatar-plugins-rag = { workspace = true }

[dependency-groups]
lint = ["packaging>=26.1,<27", "pre-commit>=4.3,<5", "ruff==0.12.9"]
test = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25.3,<2",
    "jiwer>=3.1.0",
    "scipy>=1.13.1",
    "tiktoken>=0.9.0",
]
typing = ["mypy>=1.14,<2"]
# scikit-build-core, CMake and Ninja build the llama-cpp-python wheel packaging/linux ships.
build = [
    "build>=1.2,<2",
    "cmake>=3.31,<5",
    "hatchling>=1.27,<2",
    "ninja>=1.11,<2",
    "scikit-build-core>=0.11,<1",
    "twine>=7.0,<8",
]
dev = [{ include-group = "lint" }, { include-group = "test" }, { include-group = "typing" }]
docs = ["pdoc3", "setuptools"]
# What `config init`'s reference bundle selects, as packaging/linux ships it.
reference-bundle = [
    "alpha-avatar-agents[vdb]",
    "alpha-avatar-host[livekit]",
    "alpha-avatar-plugins-context",
    "alpha-avatar-plugins-loop",
    "alpha-avatar-plugins-memory",
    "alpha-avatar-plugins-persona",
    "alpha-avatar-plugins-provider[langchain,openai]",
    "alpha-avatar-plugins-router",
    "alpha-avatar-plugins-status",
    "alpha-avatar-plugins-voice",
]
avatar-agent-all = [
    "alpha-avatar-agents[vdb]",
    "alpha-avatar-host[livekit]",
    "alpha-avatar-plugins-context",
    "alpha-avatar-plugins-loop",
    "alpha-avatar-plugins-provider[langchain,openai]",
]

[tool.ruff]
required-version = "==0.12.9"
target-version = "py313"
line-length = 100
indent-width = 4
preview = false
unsafe-fixes = false
force-exclude = true
# Extend, rather than replace, Ruff's exclusions for VCS, builds and environments.
extend-exclude = ["**/third_party/**", ".alphaavatar_workspace", ".venv*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "TID251"]
# Long prompts/URLs may exceed the formatter width; retain the existing exception-chain policy.
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["alphaavatar"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"livekit.agents" = { msg = "Use native AlphaAvatar ownership; LiveKit RTC/API/protocol are separate." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Large samples come from their Dataset only when asked for: pytest -m large_samples.
addopts = [
    "--import-mode=importlib",
    "--ignore=examples",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not large_samples",
]
testpaths = ["avatar-core/tests", "avatar-agents/tests", "avatar-host/tests", "avatar-plugins/*/*/tests"]
# Spawned inference children resolve test runners by module name; tests share small samples.
pythonpath = ["avatar-agents/tests", "avatar-agents/tests/runtime/inference", "avatar-host/tests"]
xfail_strict = true
markers = [
    "stress: synthetic pressure test; --stress-seconds extends it beyond one bounded round",
    "large_samples(*names): needs these samples of tests/fixtures/large_samples.json, fetched",
]
faulthandler_timeout = 60
tmp_path_retention_policy = "failed"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_generics = false
